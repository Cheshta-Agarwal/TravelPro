<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block title %}TravelPro{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <style>
        .seat-layout {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            max-width: 260px;
            margin-top: 15px;
        }

        .seat {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            border: 2px solid #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            background: white;
            color: #2563eb;
        }

        .seat:hover {
            background: #e0e7ff;
        }

        .seat-selected {
            background: #2563eb;
            color: white;
        }

        .seat-booked {
            background: #e5e7eb;
            border-color: #9ca3af;
            color: #6b7280;
            cursor: not-allowed;
        }

        :root {
            --tp-ink: #0f172a;
            --tp-ink-soft: #334155;
            --tp-accent: #0ea5a5;
            --tp-accent-strong: #0f766e;
            --tp-gold: #f59e0b;
            --tp-cream: #fff7ed;
            --tp-bg: #f8fafc;
            --tp-border: #e2e8f0;
        }

        body {
            font-family: "Manrope", sans-serif;
            color: var(--tp-ink);
            background:
                radial-gradient(circle at 10% 10%, rgba(14, 165, 165, 0.08), transparent 45%),
                radial-gradient(circle at 90% 10%, rgba(245, 158, 11, 0.12), transparent 45%),
                var(--tp-bg);
        }

        a {
            color: var(--tp-accent-strong);
            text-decoration: none;
        }

        a:hover {
            color: var(--tp-accent);
        }

        .tp-shell {
            max-width: 1100px;
            margin: 0 auto;
            padding: 48px 16px 64px;
        }

        .tp-title {
            font-family: "Playfair Display", serif;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .tp-lead {
            color: var(--tp-ink-soft);
            max-width: 640px;
        }

        .tp-card {
            border: none;
            border-radius: 22px;
            background: #ffffff;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
        }

        .tp-card .card-body {
            padding: 2rem;
        }

        .tp-card-header {
            padding: 1.6rem 2rem;
            border-radius: 22px 22px 0 0;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(15, 118, 110, 0.75));
            color: #f8fafc;
        }

        .tp-hero-slim {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(14, 165, 165, 0.8));
            color: #f8fafc;
            border-radius: 26px;
            padding: 2.8rem;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.2);
        }

        /* Fix for hero section text */
        .tp-hero-slim .tp-title,
        .tp-hero-slim .tp-lead,
        .tp-hero-slim .tp-badge {
            color: #ffffff !important;
            /* Force white text */
            opacity: 1 !important;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
            /* Add shadow for better readability */
        }

        .tp-hero-slim .tp-badge {
            background: rgba(255, 255, 255, 0.2);
            /* Light background for badge */
            color: #ffffff !important;
        }

        .tp-divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--tp-ink-soft);
            font-size: 0.8rem;
            letter-spacing: 0.12rem;
            text-transform: uppercase;
        }

        .tp-divider::before,
        .tp-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.5);
        }

        .tp-grid {
            display: grid;
            gap: 1.5rem;
        }

        .tp-grid-2 {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        .tp-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            background: rgba(14, 165, 165, 0.12);
            color: var(--tp-accent-strong);
            font-weight: 600;
            font-size: 0.85rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--tp-accent), var(--tp-accent-strong));
            border: none;
            box-shadow: 0 14px 24px rgba(14, 165, 165, 0.25);
        }

        .btn-outline-primary {
            border-color: rgba(15, 118, 110, 0.45);
            color: var(--tp-accent-strong);
        }

        .btn-outline-primary:hover {
            background: rgba(14, 165, 165, 0.08);
        }

        .form-control,
        .form-select {
            border-radius: 12px;
            border: 1px solid var(--tp-border);
            padding: 0.75rem 0.95rem;
        }

        .table thead {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.92), rgba(15, 118, 110, 0.7));
            color: #f8fafc;
        }

        .table thead th {
            border-bottom: none;
        }

        .table tbody tr {
            vertical-align: middle;
        }

        .tp-footer {
            background: #ffffff;
            padding: 18px 0;
            font-size: 14px;
            color: #64748b;
            border-top: 1px solid #e5e7eb;
        }

        .tp-avatar {
            width: 84px;
            height: 84px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--tp-accent), var(--tp-accent-strong));
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 700;
            margin: 0 auto;
        }

        .tp-ticket {
            border: 1px solid var(--tp-border);
            border-radius: 18px;
            padding: 2rem;
            background: #ffffff;
        }

        .tp-no-print {
            display: inline-flex;
        }

        @media print {

            nav,
            footer,
            .tp-no-print {
                display: none !important;
            }

            body {
                background: #ffffff;
            }

            .tp-card,
            .tp-ticket {
                box-shadow: none;
                border: 1px solid #e2e8f0;
            }
        }

        .seat-map {
            display: flex;
            flex-wrap: wrap;
            max-width: 260px;
            margin-top: 15px;
        }

        .seat-wrapper {
            width: 50px;
            margin: 6px;
        }

        .aisle {
            width: 30px;
        }

        /* Seat shape */
        .seat-icon {
            width: 42px;
            height: 42px;
            border-radius: 6px 6px 10px 10px;
            border: 2px solid #2563eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 600;
            color: #2563eb;
            cursor: pointer;
            background: #ffffff;
            transition: all 0.2s ease;
        }

        /* Hover */
        .seat-icon:hover {
            background: #e0e7ff;
        }

        /* Selected */
        .seat-selected {
            background: #2563eb !important;
            color: #ffffff;
        }

        /* Booked */
        .seat-booked {
            background: #e5e7eb;
            border-color: #9ca3af;
            color: #6b7280;
            cursor: not-allowed;
        }
    </style>
    <script>
        let selectedSeat = null;

        function selectSeat(el) {
            if (el.classList.contains("seat-booked")) return;

            if (selectedSeat) {
                selectedSeat.classList.remove("seat-selected");
            }

            el.classList.add("seat-selected");
            selectedSeat = el;

            document.getElementById("selectedSeat").value =
                el.getAttribute("data-seat-id");
        }
    </script>
    </script>
</head>

<body class="d-flex flex-column min-vh-100">

    {% include "navbar.html" %}

    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
    </div>
    {% endif %}

    <main class="flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="tp-footer text-center">
        (c) 2026 TravelPro. All rights reserved.
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
